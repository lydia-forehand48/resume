<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Discover Your World</title>
        <meta charset="UTF-8">
        <link rel="icon" href="https://edube.org/uploads/media/default/0001/04/web-favicon.png">
        <script src="module6.js"></script>
    </head>

    <body>
        <h1>Discover Your World &#xF5FA</h1>
        <p>Click the button below to learn about the continent you're on and some famous geographical features!</p>
        <button id="discoverLocation">Discover Location</button>

        <img src="https://edube.org/uploads/media/default/0001/04/continents.jpg" usemap="#image-map" alt="World Map">
        <map name="image-map">
            <area target="" alt="North America" title="North America" id="north-america" shape="rect" coords="386,283,41,17" href="javascript:void(0);">
            <area target="" alt="South America" title="South America" id="south-america" shape="rect" coords="209,501,358,288" href="javascript:void(0);">
            <area target="" alt="Europe" title="Europe" id="europe" shape="rect" coords="391,68,505,217" href="javascript:void(0);">
            <area target="" alt="Africa" title="Africa" id="africa" shape="rect" coords="533,217,387,448" href="javascript:void(0);">
            <area target="" alt="Asia" title="Asia" id="asia" shape="rect" coords="893,153,506,1" href="javascript:void(0);">
            <area target="" alt="Australia and Oceania" title="Australia and Oceania" id="australia-and-oceania" shape="rect" coords="679,353,872,480" href="javascript:void(0);">
        </map>

    </body>

</html>
